<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avelina</title>
<meta name="description" content="Avelina, cantautora de Monterrey. Canto lo que escribo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --fondo:#F5F0E8; --tinta:#14140E; --acento:#B97E0A; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:grid; place-items:center; background:var(--fondo); color:var(--tinta);
         font-family:Inter, system-ui, sans-serif; padding:24px 16px; text-align:center; }
  h1 { font-family:Fraunces, Georgia, serif; font-weight:600; font-size:clamp(3rem, 12vw, 7rem); letter-spacing:-.02em; }
  p { margin-top:.5rem; font-size:1.15rem; color:#4a4a40; }
  nav { margin-top:2.5rem; display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; }
  a { color:var(--tinta); text-decoration:none; border:1px solid var(--tinta); border-radius:999px; padding:.6rem 1.3rem; font-weight:500; }
  a:hover { background:var(--tinta); color:var(--fondo); }
  footer { margin-top:3rem; font-size:.85rem; color:#7a7a6e; }
</style>
</head>
<body>
<main>
  <h1>Avelina</h1>
  <p>Canto lo que escribo</p>
  <nav>
    <a href="https://www.tiktok.com/@avelinamm7" target="_blank" rel="noopener">TikTok</a>
    <a href="https://www.instagram.com/avelinaa.mar/" target="_blank" rel="noopener">Instagram</a>
  </nav>
  <footer>Monterrey, México</footer>
</main>
</body>
</html>
